name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate the next version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.version_tag }}
        run: gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --generate-notes