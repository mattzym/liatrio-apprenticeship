name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Test to show image to deploy
        run: echo "Would deploy mattzym/liatrio-app:${{ github.event.workflow_run.head_sha }}"