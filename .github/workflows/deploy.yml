name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy versioned image to ECS
        run: |
          aws ecs update-express-gateway-service \
            --service-arn ${{ vars.ECS_SERVICE_ARN }} \
            --primary-container image=docker.io/mattzym/liatrio-app:${{ github.event.workflow_run.head_sha }}