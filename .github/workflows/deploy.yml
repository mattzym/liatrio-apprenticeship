name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: liatrio-app-4554
          cluster: default
          image: docker.io/mattzym/liatrio-app:${{ github.event.workflow_run.head_sha }}
          execution-role-arn: arn:aws:iam::174302434325:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::174302434325:role/service-role/ecsInfrastructureRoleForExpressServices
          container-port: 3000
          health-check-path: /
      - name: Verify the deployed response
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          URL="$ENDPOINT"
          case "$URL" in http*) ;; *) URL="https://$URL" ;; esac
          echo "Checking $URL"
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "$URL")
            echo "$RESPONSE"
            if echo "$RESPONSE" | grep -q '"environment"'; then
              echo "New field is live"
              exit 0
            fi
            sleep 15
          done
          echo "Expected field not found in the live response"
          exit 1