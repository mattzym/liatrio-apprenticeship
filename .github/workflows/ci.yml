name: CI

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/liatrio-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Run Docker container
        run: docker run -d -p 80:3000 $IMAGE_NAME:${{ github.sha }}

      - name: Wait for app
        run: curl --retry 10 --retry-connrefused --retry-delay 1 -s http://localhost:80/

      - name: Run tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91
